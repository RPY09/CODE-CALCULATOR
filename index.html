<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="calculator" aria-label="Calculator">
        <div class="display-wrap">
          <div class="expression" id="expression">0</div>
          <div class="result" id="display">0</div>
        </div>

        <div class="keypad">
          <button class="btn soft toggle-btn" data-action="toggle">⇄</button>
          <button class="btn soft" data-action="percent">%</button>
          <button class="btn soft" data-action="clear">C</button>
          <button class="btn op" data-action="divide">÷</button>

          <button class="btn num" data-value="7">7</button>
          <button class="btn num" data-value="8">8</button>
          <button class="btn num" data-value="9">9</button>
          <button class="btn op" data-action="multiply">×</button>

          <button class="btn num" data-value="4">4</button>
          <button class="btn num" data-value="5">5</button>
          <button class="btn num" data-value="6">6</button>
          <button class="btn op" data-action="subtract">−</button>

          <button class="btn num" data-value="1">1</button>
          <button class="btn num" data-value="2">2</button>
          <button class="btn num" data-value="3">3</button>
          <button class="btn op" data-action="add">+</button>

          <button class="btn num zero" data-value="0">0</button>
          <button class="btn num" data-value=".">.</button>
          <button
            class="btn danger"
            data-action="backspace"
            aria-label="Backspace"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-backspace-fill"
              viewBox="0 0 16 16"
            >
              <path
                d="M15.683 3a2 2 0 0 0-2-2h-7.08a2 2 0 0 0-1.519.698L.241 7.35a1 1 0 0 0 0 1.302l4.843 5.65A2 2 0 0 0 6.603 15h7.08a2 2 0 0 0 2-2zM5.829 5.854a.5.5 0 1 1 .707-.708l2.147 2.147 2.146-2.147a.5.5 0 1 1 .707.708L9.39 8l2.146 2.146a.5.5 0 0 1-.707.708L8.683 8.707l-2.147 2.147a.5.5 0 0 1-.707-.708L7.976 8z"
              />
            </svg>
          </button>
          <button class="btn equal" data-action="equals">=</button>
        </div>
      </div>

      <div class="legend" aria-label="Letter code legend">
        <span>P=0</span>
        <span>Q=1</span>
        <span>R=2</span>
        <span>S=3</span>
        <span>T=4</span>
        <span>U=5</span>
        <span>V=6</span>
        <span>W=7</span>
        <span>X=8</span>
        <span>Y=9</span>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
